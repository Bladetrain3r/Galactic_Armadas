name: ci

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux packages SDL's video backend compiles against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxfixes-dev libxrender-dev \
            libxss-dev libxxf86vm-dev libxinerama-dev
      - name: Confirm CMake is on PATH
        run: cmake --version
      - uses: swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build the binary
        run: cargo build --release

  # Ubuntu 24.04's PipeWire 1.0 headers still match SDL 2.0. PipeWire 1.4
  # changed pw_node_enum_params to take struct pw_node *, which is the break.
  modern-pipewire:
    name: fedora pipewire headers
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install git so checkout can run
        run: dnf install -y --setopt=install_weak_deps=False git
      - uses: actions/checkout@v4
      - name: Compiler, CMake, Rust, X11, and current PipeWire
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ cmake make pkgconf-pkg-config \
            rust cargo \
            libX11-devel libXext-devel libXrandr-devel libXi-devel \
            libXcursor-devel libXfixes-devel libXrender-devel \
            libXScrnSaver-devel libXxf86vm-devel libXinerama-devel \
            pipewire-devel
      - name: Confirm the headers have the breaking signature
        run: |
          header=$(rpm -ql pipewire-devel | grep '/pipewire/node.h$' | head -n 1)
          grep -q 'pw_node_enum_params(struct pw_node' "$header"
      - name: Test
        run: cargo test --release
      - name: Build the binary
        run: cargo build --release
