name: ci

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux packages SDL's video backend compiles against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxfixes-dev libxrender-dev \
            libxss-dev libxxf86vm-dev libxinerama-dev
      - name: Confirm CMake is on PATH
        run: cmake --version
      - uses: swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build the binary
        run: cargo build --release
